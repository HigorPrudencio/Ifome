<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Pedidos</title>

    <link rel="stylesheet" href="site.css">
</head>

<body>

    <header>
        <h1>IFOME</h1>
        <p>Faça seu pedido de forma rápida e fácil.</p>
    </header>

    <main>

        <section class="produtos">

            <h2>Produtos</h2>

            <div class="pesquisa-produtos">
            <input
            type="search"
            id="pesquisa-produtos"
            placeholder="Buscar hambúrguer, batata, açaí..."
            aria-label="Pesquisar produtos"
        >
            </div>

           <div class="lista-produtos" id="lista-produtos"></div>

            <p id="nenhum-resultado" hidden>
                Nenhum produto encontrado.
            </p>


        </section>


        <section class="carrinho">

            <h2>Seu pedido</h2>

            <div id="lista-carrinho">
                <p>Nenhum produto adicionado.</p>
            </div>

            <div class="total">
                Total: R$ <span id="total">0.00</span>
            </div>

            <button class="finalizar" onclick="finalizarPedido()">
                Finalizar pedido
            </button>

            <div id="mensagem-pedido" class="mensagem-pedido" role="status" aria-live="polite">
    <div class="icone-pedido">✓</div>
    <div>
        <strong id="titulo-pedido">Pedido em preparação!</strong>
        <p id="texto-pedido">Seu pedido foi confirmado com sucesso.</p>
    </div>
    </div>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="controle.js"></script>

</body>

</html>
